[package]
name = "cognition-wp-native"
version = "0.1.0"
edition = "2021"
description = "Cognitience WP — native Windows host (WebView2 + local Rust backend)"
license = "MIT"
authors = ["Cognitience"]

[[bin]]
name = "cognition-wp-native"
path = "src/main.rs"

[dependencies]
anyhow = "1"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
tao = "0.32"
wry = "0.50"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
tempfile = "3"
