  <script>
    (function () {
      function esc(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function inlineMd(text) {
        return esc(text)
          .replace(/`([^`]+)`/g, '<code>$1</code>')
          .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      }

      function renderMd(md) {
        var lines = md.replace(/\r\n/g, '\n').split('\n');
        var html = [];
        var i = 0;
        var inCode = false;
        var codeLang = '';
        var code = [];
        var inUl = false;
        var inTable = false;

        function closeUl() {
          if (inUl) { html.push('</ul>'); inUl = false; }
        }
        function closeTable() {
          if (inTable) { html.push('</tbody></table>'); inTable = false; }
        }

        while (i < lines.length) {
          var line = lines[i];
          if (line.indexOf('```') === 0) {
            if (!inCode) {
              closeUl(); closeTable();
              inCode = true;
              codeLang = line.slice(3).trim();
              code = [];
            } else {
              html.push('<pre><code>' + esc(code.join('\n')) + '</code></pre>');
              inCode = false;
            }
            i++;
            continue;
          }
          if (inCode) { code.push(line); i++; continue; }

          if (/^\|/.test(line) && lines[i + 1] && /^\|?\s*-+/.test(lines[i + 1])) {
            closeUl();
            var headers = line.split('|').slice(1, -1).map(function (c) { return c.trim(); });
            html.push('<table><thead><tr>' + headers.map(function (h) { return '<th>' + inlineMd(h) + '</th>'; }).join('') + '</tr></thead><tbody>');
            inTable = true;
            i += 2;
            while (i < lines.length && /^\|/.test(lines[i])) {
              var cells = lines[i].split('|').slice(1, -1).map(function (c) { return c.trim(); });
              html.push('<tr>' + cells.map(function (c) { return '<td>' + inlineMd(c) + '</td>'; }).join('') + '</tr>');
              i++;
            }
            closeTable();
            continue;
          }

          if (/^### /.test(line)) { closeUl(); closeTable(); html.push('<h3>' + inlineMd(line.slice(4)) + '</h3>'); i++; continue; }
          if (/^## /.test(line)) { closeUl(); closeTable(); html.push('<h2>' + inlineMd(line.slice(3)) + '</h2>'); i++; continue; }
          if (/^# /.test(line)) { closeUl(); closeTable(); html.push('<h1>' + inlineMd(line.slice(2)) + '</h1>'); i++; continue; }
          if (/^[-*] /.test(line)) {
            closeTable();
            if (!inUl) { html.push('<ul>'); inUl = true; }
            html.push('<li>' + inlineMd(line.slice(2)) + '</li>');
            i++;
            continue;
          }
          if (!line.trim()) { closeUl(); closeTable(); i++; continue; }
          closeUl(); closeTable();
          html.push('<p>' + inlineMd(line) + '</p>');
          i++;
        }
        closeUl(); closeTable();
        return html.join('\n');
      }

      var host = document.getElementById('docs-md');
      fetch('docs/extensions.md')
        .then(function (r) { if (!r.ok) throw new Error('Could not load guide'); return r.text(); })
        .then(function (md) { host.innerHTML = renderMd(md); })
        .catch(function (e) { host.textContent = e.message || 'Failed to load docs.'; });
    })();
  </script>
