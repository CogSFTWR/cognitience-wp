name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            package_cmd: package:mac
            artifact_glob: 'release/*.{dmg,zip}'
          - os: windows-latest
            package_cmd: package:win
            artifact_glob: 'release/*.exe'
          - os: ubuntu-latest
            package_cmd: package:linux
            artifact_glob: 'release/*.tar.gz'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.package_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          shopt -s nullglob
          for f in ${{ matrix.artifact_glob }}; do
            [ -f "$f" ] && cp "$f" release-artifacts/
          done
          if [ ! "$(ls -A release-artifacts)" ]; then
            echo "No artifacts found for ${{ matrix.os }}"
            ls -la release/ || true
            exit 1
          fi
          ls -la release-artifacts/
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
